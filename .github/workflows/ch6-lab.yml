name: CH6 offline lab
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -X utf8 scripts/verify_environment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ch6-verification
          path: outputs/
